server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA — unknown paths fall back to index.html.
    # O frontend chama a API direto na URL do backend (VITE_API_URL), então
    # não há proxy /api aqui.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
