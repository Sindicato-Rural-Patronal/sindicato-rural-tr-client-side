server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA — unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy — strips /api prefix, mirrors Vite dev proxy
    location /api/ {
        # DNS embutido do Docker. Resolver + proxy_pass com variável adia a
        # resolução para o request: o nginx sobe mesmo se a API ainda não existe
        # e pega o IP novo quando o container da API é recriado (redeploy).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend ${BACKEND_URL};

        # Com variável em proxy_pass o nginx não remove o prefixo da location,
        # então o rewrite faz o strip do /api que o proxy_pass literal fazia.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
