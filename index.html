<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo-full.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f6e3d" />
    <title>Sindicato Rural de Terra Roxa</title>
    <meta
      name="description"
      content="Sindicato Rural de Terra Roxa (PR) — cursos agrícolas do SENAR, notícias e informações para o produtor rural."
    />
    <!-- OpenGraph / social preview (padrão do site; páginas ajustam o título via JS) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sindicato Rural de Terra Roxa" />
    <meta property="og:title" content="Sindicato Rural de Terra Roxa" />
    <meta
      property="og:description"
      content="Cursos agrícolas do SENAR, notícias e informações para o produtor rural de Terra Roxa - PR."
    />
    <meta property="og:image" content="/logo-full.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sindicato Rural de Terra Roxa" />
    <meta
      name="twitter:description"
      content="Cursos agrícolas do SENAR, notícias e informações para o produtor rural de Terra Roxa - PR."
    />
    <meta name="twitter:image" content="/logo-full.png" />
    <!-- Tela de carregamento enquanto o JS baixa (internet lenta). Fica dentro de
         #root: o React a substitui no primeiro render. CSS puro, segue o tema do
         sistema (o tema escolhido no site só vale depois que o app carrega). -->
    <style>
      .boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #ffffff;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      .boot-loader img { width: 72px; height: 72px; object-fit: contain; }
      .boot-spinner {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 3px solid rgba(31, 110, 61, 0.2);
        border-top-color: #1f6e3d;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        .boot-loader { background: #0a0a0a; }
        .boot-spinner { border-color: rgba(74, 186, 116, 0.25); border-top-color: #4aba74; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner { animation-duration: 2.4s; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loader" role="status" aria-label="Carregando">
        <img src="/logo-full.png" alt="" width="72" height="72" />
        <span class="boot-spinner"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
