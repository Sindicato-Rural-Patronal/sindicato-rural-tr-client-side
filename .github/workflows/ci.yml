name: CI

# Por que existe: este repositório ficou sem nenhuma verificação automática, e
# um `npm run build` quebrado chegou a ser publicado na staging sem ninguém
# notar. O tsconfig.app.json compila os TESTES junto e não tem os tipos do
# Node, então um teste que usa API do Node quebra a compilação sem derrubar o
# `vitest`, que não confere tipos. Quem pega isso são o Type check e o Build.

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Confere os dois projetos de verdade. O tsconfig.json da raiz só aponta
      # para eles (`"files": []`): `tsc --noEmit` lá não lia arquivo nenhum e
      # passava sempre, e erro de tipo só aparecia no Build, no fim da fila.
      - name: Type check
        run: |
          npx tsc -p tsconfig.app.json --noEmit
          npx tsc -p tsconfig.node.json --noEmit

      - name: Unit tests
        run: npm run test:run

      # `tsc -b && vite build`: confere os mesmos dois projetos de novo e pega
      # o que só aparece ao empacotar (import que não resolve, asset que falta).
      - name: Build
        run: npm run build
