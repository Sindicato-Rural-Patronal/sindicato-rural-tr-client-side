name: CI

# Por que existe: este repositório ficou sem nenhuma verificação automática, e
# um `npm run build` quebrado chegou a ser publicado na staging sem ninguém
# notar — o `tsc -b` do build compila os TESTES junto, então um teste que usa
# API do Node (o tsconfig.app.json não tem os tipos dele) derruba o build sem
# derrubar o `vitest`. É por isso que o passo de build está aqui, e não só o
# type check: os dois olham configurações diferentes.

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:run

      # `tsc -b && vite build`: é este passo que pega o que o type check acima
      # deixa passar, porque usa o tsconfig.app.json (sem os tipos do Node).
      - name: Build
        run: npm run build
